state_file = "auto"

[hotkey]
key = "SCROLLLOCK"

[audio]
device = "default"
sample_rate = 16000
max_duration_secs = 120

[whisper]
model = "large-v3-turbo"
language = "en"
translate = false

[osd]
frontend = "quickshell"

[output]
mode = "type"
fallback_to_clipboard = true
type_delay_ms = 0

[output.notification]
on_recording_start = false
on_recording_stop = false
on_transcription = false
