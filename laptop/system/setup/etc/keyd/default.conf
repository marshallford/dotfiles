# macOS-style keys, without a blind swap. leftmeta (Cmd on the NuPhy in Mac
# mode, the Windows key on the built-in) becomes a layer: listed keys send Ctrl
# combos, everything else falls through as Super so it still drives niri. Corner
# Ctrl and Alt/Option are untouched.

[ids]
# Built-in keyboard
0001:0001
# NuPhy Air75 V3 (Bluetooth)
07d7:0000
# NuPhy Air75 V3 Dongle (2.4GHz)
19f5:2620
# NuPhy Air75 V3 (wired)
19f5:1028

[main]
leftmeta  = layer(cmd)
rightmeta = layer(cmd)

# :M = unlisted keys fall through as Super (niri Mod).
[cmd:M]
c = C-c
v = C-v
x = C-x
z = C-z
a = C-a
s = C-s

# Mac-mode PrtSc sends Cmd+Shift+4/3; route to niri's Print binds (region/full)
leftshift+4 = sysrq
leftshift+3 = C-sysrq
